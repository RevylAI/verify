name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the release validation and npm publish dry-run without publishing
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scoped_published: ${{ steps.registry.outputs.scoped_published }}
      alias_published: ${{ steps.registry.outputs.alias_published }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install supported npm
        run: npm install --global npm@11.5.1
      - name: Check npm version
        run: npm --version
      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main
      - name: Require workflow dispatch dry-run
        if: github.event_name == 'workflow_dispatch'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: test "$DRY_RUN" = true
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package
      - name: Pack the release artifacts
        run: |
          mkdir -p release-artifacts/scoped release-artifacts/alias
          npm pack --workspace ./packages/verify --pack-destination ./release-artifacts/scoped
          npm pack --workspace ./packages/revyl-verify --pack-destination ./release-artifacts/alias
      - name: Check npm versions and archive integrity
        id: registry
        run: node scripts/check-published.mjs "$GITHUB_EVENT_NAME" release-artifacts/scoped/*.tgz release-artifacts/alias/*.tgz
      - name: Dry-run scoped publication
        if: github.event_name == 'workflow_dispatch' || steps.registry.outputs.scoped_published == 'false'
        run: npm publish ./release-artifacts/scoped/*.tgz --dry-run --access public
      - name: Dry-run alias publication
        if: github.event_name == 'workflow_dispatch' || steps.registry.outputs.alias_published == 'false'
        run: npm publish ./release-artifacts/alias/*.tgz --dry-run --access public
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: npm-package-${{ github.sha }}
          path: release-artifacts/**/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && (needs.validate.outputs.scoped_published == 'false' || needs.validate.outputs.alias_published == 'false')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install supported npm
        run: npm install --global npm@11.5.1
      - name: Check npm version
        run: npm --version
      - uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: release-artifacts
      - run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - name: Require public source for provenance
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: test "$REPOSITORY_VISIBILITY" = public
      - name: Publish scoped package with provenance
        if: needs.validate.outputs.scoped_published == 'false'
        run: npm publish ./release-artifacts/scoped/*.tgz --provenance --access public
      - name: Publish alias with provenance
        if: needs.validate.outputs.alias_published == 'false'
        run: npm publish ./release-artifacts/alias/*.tgz --provenance --access public

  release:
    if: always() && github.event_name == 'push' && needs.validate.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists."
          else
            version="${GITHUB_REF_NAME#v}"
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "@revyl/verify $version" \
              --generate-notes
          fi
