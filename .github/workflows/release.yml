name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scoped_published: ${{ steps.registry.outputs.scoped_published }}
      alias_published: ${{ steps.registry.outputs.alias_published }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --global npm@11
      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main
      - name: Check npm versions and require explicit CI publication opt-in
        id: registry
        env:
          VERIFY_CI_PUBLISH_ENABLED: ${{ vars.VERIFY_CI_PUBLISH_ENABLED }}
        run: node scripts/check-published.mjs "$GITHUB_EVENT_NAME"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package
      - name: Pack the release artifacts
        run: |
          mkdir -p release-artifacts/scoped release-artifacts/alias
          npm pack --workspace ./packages/verify --pack-destination ./release-artifacts/scoped
          npm pack --workspace ./packages/revyl-verify --pack-destination ./release-artifacts/alias
      - name: Dry-run scoped publication
        if: steps.registry.outputs.scoped_published == 'false'
        run: npm publish ./release-artifacts/scoped/*.tgz --dry-run --access public
      - name: Dry-run alias publication
        if: steps.registry.outputs.alias_published == 'false'
        run: npm publish ./release-artifacts/alias/*.tgz --dry-run --access public
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: npm-package-${{ github.sha }}
          path: release-artifacts/**/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && (needs.validate.outputs.scoped_published == 'false' || needs.validate.outputs.alias_published == 'false') && vars.VERIFY_CI_PUBLISH_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: release-artifacts
      - run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - name: Require public source for provenance
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: test "$REPOSITORY_VISIBILITY" = public
      - name: Publish scoped package with provenance
        if: needs.validate.outputs.scoped_published == 'false'
        run: npm publish ./release-artifacts/scoped/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish alias with provenance
        if: needs.validate.outputs.alias_published == 'false'
        run: npm publish ./release-artifacts/alias/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
