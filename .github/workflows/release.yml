name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --global npm@11
      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main
      - name: Check whether this version is already published
        id: registry
        if: github.event_name == 'push'
        run: node scripts/check-published.mjs
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package
      - name: Pack and dry-run the release artifact
        run: |
          mkdir release-artifacts
          npm pack --workspace ./packages/verify --pack-destination ./release-artifacts
          npm publish ./release-artifacts/*.tgz --dry-run --access public
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: npm-package-${{ github.sha }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.validate.outputs.published == 'false'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: release-artifacts
      - run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - name: Require public source for provenance
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: test "$REPOSITORY_VISIBILITY" = public
      - name: Publish with provenance
        run: npm publish ./release-artifacts/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
